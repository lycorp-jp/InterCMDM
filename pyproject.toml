[project]
name = "intercmdm"
version = "0.1.0"
description = "Official implementation of InterCMDM for autoregressive human interaction generation"
readme = "README.md"
requires-python = "==3.10.9"
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "torchaudio==2.6.0",
  "einops>=0.8.1",
  "diffusers==0.31.0",
  "transformers>=4.57.0",
  "torchdiffeq>=0.2.5",
  "pip>=25.2",
  "clip",
  "matplotlib==3.3.2",
  "numpy==1.24.3",
  "packaging>=25.0",
  "ninja>=1.13.0",
  "lmdb>=1.7.3",
  "omegaconf>=2.3.0",
  "hydra-core>=1.3.2",
  "opencv-python>=4.11.0.86",
  "wandb>=0.22.2",
  "easydict>=1.13",
  "huggingface-hub[cli]>=0.35.3",
  "accelerate>=1.11.0",
  "matplotlib-inline==0.1.6",
  "ipykernel>=7.0.1",
  "flash-attn==2.7.3",
  "tiktoken>=0.12.0",
  "sentencepiece==0.2.0",
  "joblib>=1.5.2",
  "smplx>=0.1.28",
  "sentence-transformers>=5.1.2",
  "timm>=1.0.22",
  "torch-geometric==2.3.1",
  "positional-encodings==6.0.3",
  "sparsemax==0.1.9",
  "h5py>=3.15.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
clip = { git = "https://github.com/openai/CLIP.git" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
